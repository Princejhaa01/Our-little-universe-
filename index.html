<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>our little universe ✨️</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#ffd6e8;--blue:#d6ecff;--cream:#fff8ec;--ink:#5b4a6b;--sh:rgba(120,90,140,.25)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Fredoka',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
  background:linear-gradient(135deg,#ffe3ef,#e3f0ff 60%,#fff3d9);background-attachment:fixed}
.hidden{display:none!important}
.clay{background:var(--cream);border-radius:32px;
  box-shadow:12px 12px 24px var(--sh),-10px -10px 20px #fff,inset 6px 6px 12px rgba(255,255,255,.8),inset -6px -6px 12px rgba(160,120,180,.12)}
.btn{font-family:inherit;font-weight:600;font-size:16px;border:none;border-radius:22px;padding:12px 22px;cursor:pointer;
  background:var(--pink);color:var(--ink);box-shadow:6px 6px 14px var(--sh),-5px -5px 12px #fff,inset 3px 3px 6px rgba(255,255,255,.7);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(2px) scale(.98)}
.btn.blue{background:var(--blue)}
.btn.small{padding:6px 12px;font-size:14px;border-radius:14px}
input,textarea{font-family:inherit;width:100%;padding:12px 16px;border:none;border-radius:18px;background:#fff;color:var(--ink);font-size:16px;outline:none;margin-bottom:12px;
  box-shadow:inset 4px 4px 8px rgba(0,0,0,.06),inset -4px -4px 8px #fff}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{max-width:380px;width:100%;padding:36px;text-align:center}
.card h1,.hero h1{font-family:Caveat,cursive;font-size:44px;line-height:1.1;margin-bottom:10px}
.err{color:#d6336c;min-height:22px;margin-top:10px;font-size:15px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* Scroll progress bar */
#progress{position:fixed;top:0;left:0;height:5px;width:0;z-index:200;
  background:linear-gradient(90deg,#ff8fb8,#9cc9ff,#ffd86b);border-radius:0 4px 4px 0;box-shadow:0 2px 6px rgba(255,140,180,.5)}

/* Scroll reveal animations (uses individual transform props so it doesn't clash with hover/rotate) */
.reveal{opacity:0;translate:0 60px;transition:opacity .8s ease,translate .8s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;translate:0 0}
.reveal.from-left{translate:-80px 0}
.reveal.from-right{translate:80px 0}
.reveal.from-left.in,.reveal.from-right.in{translate:0 0}
.delay-1{transition-delay:.1s}.delay-2{transition-delay:.2s}.delay-3{transition-delay:.3s}

/* Floating hearts */
.float{position:fixed;bottom:-30px;font-size:22px;pointer-events:none;z-index:1;animation:floatUp linear forwards;opacity:.8}
@keyframes floatUp{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}

/* App */
#app{padding:90px 18px 40px;max-width:1000px;margin:auto}
.fab{position:fixed;top:16px;right:16px;z-index:60}
.logout{position:absolute;top:18px;left:18px}
.hero{text-align:center;padding:40px 20px;margin-bottom:34px;position:relative}
.hero .names{font-family:Caveat,cursive;font-size:30px;color:#c2578f}
.hero p.count{margin-top:8px;font-size:18px}
.scroll-hint{margin-top:18px;font-size:14px;opacity:.6;animation:bounce 1.8s infinite}
@keyframes bounce{0%,100%{translate:0 0}50%{translate:0 8px}}
h2{font-family:Caveat,cursive;font-size:38px;margin:10px 0 16px}
section{margin-bottom:50px}

/* Scrapbook */
.board{margin-top:24px;padding:30px 20px;border-radius:32px;background-color:#f6ecd9;
  background-image:radial-gradient(#d9c7a5 1.2px,transparent 1.3px);background-size:22px 22px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:34px;
  box-shadow:inset 6px 6px 14px rgba(120,90,40,.15),8px 8px 18px var(--sh)}
.polaroid{background:#fff;padding:12px 12px 16px;border-radius:6px;position:relative;
  box-shadow:0 10px 20px rgba(0,0,0,.15);transform:rotate(var(--r));transition:transform .2s}
.polaroid:hover{transform:rotate(0) scale(1.03)}
.polaroid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;display:block}
.tape{position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(-3deg);width:90px;height:26px;background:rgba(255,226,140,.75);box-shadow:0 2px 4px rgba(0,0,0,.08)}
.cap{font-family:Caveat,cursive;font-size:24px;text-align:center;margin-top:8px;line-height:1.1}
.meta{font-size:13px;text-align:center;opacity:.65;margin-top:2px}
.pbtns{display:flex;gap:6px;justify-content:center;margin-top:10px}

/* Diary */
.diary{position:relative;max-width:820px;margin:auto;padding:30px 30px 30px 70px;border-radius:6px 26px 26px 6px;
  background-color:#fff1a0;
  background-image:repeating-linear-gradient(transparent 0 31px,#e8c35e 31px 32px);
  box-shadow:12px 12px 24px var(--sh),-2px 0 0 #e0b84e inset;}
.diary::before{content:"";position:absolute;left:52px;top:0;bottom:0;width:2px;background:#e88aa0;opacity:.7}
.rings{position:absolute;left:14px;top:0;bottom:0;width:26px;
  background:radial-gradient(circle,#fff8e0 0 4px,#7d6d45 5px 7px,transparent 8px) 0 6px/26px 34px repeat-y}
.diary .entry{font-family:Caveat,cursive;font-size:24px;line-height:32px;margin-bottom:18px;padding-bottom:10px;word-break:break-word;white-space:pre-wrap;
  border-bottom:2px dashed rgba(232,195,94,.6)}
.diary .entry b{color:#b5487a;font-weight:700}
.diary .eb{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle}
.dphoto-wrap{display:flex;justify-content:center;margin:14px 0 6px}
.dphoto{position:relative;background:#fff;padding:8px 8px 12px;border-radius:6px;box-shadow:0 8px 16px rgba(0,0,0,.15);
  transform:rotate(-1.5deg);max-width:280px;width:100%}
.dphoto img{width:100%;max-height:320px;object-fit:cover;border-radius:4px;display:block}
.dphoto .tape{width:70px;height:20px;top:-10px}
.diary form{margin-bottom:24px}
.diary textarea{background:transparent;box-shadow:none;border:2px dashed #e8c35e;font-family:Caveat,cursive;font-size:22px;line-height:32px;min-height:96px}
.diary input[type=date]{background:#fff;max-width:220px}
.dform-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.dform-row .btn{margin-bottom:12px}
#dPreviewWrap{position:relative;max-width:220px;margin:0 0 12px}
#dPreview{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block}
#dRemovePhoto{position:absolute;top:6px;right:6px;padding:4px 10px}
#dFile{background:#fff;font-size:14px;padding:10px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(60,40,80,.35);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal .clay{width:100%;max-width:400px;padding:28px}
#pPreview{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px;margin-bottom:12px}

/* Chat */
.chat{position:fixed;top:0;right:0;bottom:0;width:min(370px,100%);z-index:90;border-radius:32px 0 0 32px;
  display:flex;flex-direction:column;padding:20px;transform:translateX(110%);transition:transform .35s ease}
.chat.open{transform:translateX(0)}
.chat-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.chat-head h3{font-family:Caveat,cursive;font-size:30px}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px}
.msg{max-width:80%;background:#fff;padding:10px 14px;border-radius:18px 18px 18px 4px;align-self:flex-start;box-shadow:4px 4px 10px var(--sh)}
.msg small{font-size:11px;opacity:.6}
.msg.me{align-self:flex-end;background:var(--pink);border-radius:18px 18px 4px 18px}
#chatForm{display:flex;gap:8px;margin-top:12px}
#chatForm input{margin:0}

@media (prefers-reduced-motion:reduce){
  .reveal{transition:none;opacity:1;translate:0 0}
  .scroll-hint,.float{animation:none}
}
</style>
</head>
<body>
<div id="progress"></div>

<!-- PASSWORD GATE -->
<div id="gate" class="center">
  <div class="clay card" id="gateCard">
    <h1>our little universe ✨️</h1>
    <p>Pehle secret password daalo 🔒</p>
    <input id="gatePass" type="password" placeholder="Password">
    <button class="btn blue" id="gateBtn">Enter 💖</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<!-- GOOGLE LOGIN -->
<div id="login" class="center hidden">
  <div class="clay card">
    <h1>Welcome back 💕</h1>
    <p style="margin-bottom:22px">Google se sign in karo</p>
    <button class="btn" id="googleBtn">🔐 Sign in with Google</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">
  <button class="btn blue fab" id="chatBtn">💬 Chat</button>

  <header class="clay hero reveal">
    <button class="btn small logout" id="logoutBtn">Logout</button>
    <h1>our little universe ✨️</h1>
    <p class="names">Antra 💖 Prince</p>
    <p class="count">Together for <b id="days">0</b> days 🎂 · since 4 March 2026</p>
    <p class="scroll-hint">↓ scroll karo</p>
  </header>

  <section>
    <h2 class="reveal from-left">📸 Our Scrapbook</h2>
    <button class="btn reveal" id="addPhoto">+ Add photo</button>
    <div class="board reveal" id="board"></div>
  </section>

  <section>
    <h2 class="reveal from-right">📖 Our Diary</h2>
    <div class="diary reveal">
      <div class="rings"></div>
      <form id="diaryForm">
        <input type="date" id="dDate" required>
        <textarea id="dText" placeholder="Aaj ki baat likho... 💭" required></textarea>

        <div id="dPreviewWrap" class="hidden">
          <img id="dPreview" alt="">
          <button type="button" class="btn small" id="dRemovePhoto">✖</button>
        </div>
        <input type="file" id="dFile" accept="image/*" style="margin-bottom:12px">

        <div class="dform-row">
          <button class="btn small blue" type="submit" id="dSave">Save entry 💛</button>
          <button class="btn small hidden" type="button" id="dCancel">Cancel</button>
        </div>
      </form>
      <div id="entries"></div>
    </div>
  </section>

  <aside class="clay chat" id="chat">
    <div class="chat-head">
      <h3>our chat 💌</h3>
      <button class="btn small" id="chatClose">✖</button>
    </div>
    <div id="msgs"></div>
    <form id="chatForm">
      <input id="chatIn" placeholder="Message likho..." autocomplete="off">
      <button class="btn small blue" type="submit">➤</button>
    </form>
  </aside>
</div>

<!-- PHOTO MODAL -->
<div class="modal hidden" id="photoModal">
  <div class="clay">
    <h2 id="pTitle">Nayi yaad 📸</h2>
    <img id="pPreview" class="hidden" alt="">
    <input type="file" id="pFile" accept="image/*">
    <input id="pCaption" placeholder="Caption (jaise: Our first trip 🌸)">
    <input type="date" id="pDate">
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn small" id="pCancel">Cancel</button>
      <button class="btn small blue" id="pSave">Save 💾</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAiKgwAqCptCiWh3xG2DgIRdnOy9dlt3Ww",
  authDomain: "our-little-universe-73207.firebaseapp.com",
  projectId: "our-little-universe-73207",
  storageBucket: "our-little-universe-73207.firebasestorage.app",
  messagingSenderId: "446105820889",
  appId: "1:446105820889:web:8a2222ee8429b3d92da8c8",
  measurementId: "G-QCNJYS0QS5"
};

const PASSWORD = "Antra@4545";
// ⚠️ Yahan dono ke actual Google emails daalo
const ALLOWED_EMAILS = ["antragond40@gmail.com", "jhap20046@gmail.com"];
const START = new Date(2026, 2, 4); // 4 March 2026

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let gatePassed = false, listening = false;
let photoEditId = null, photoSrc = null, diaryEditId = null, diaryPhoto = null;
const photoMap = new Map(), diaryMap = new Map();

/* ---------- Scroll animations ---------- */
const revealIO = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (en.isIntersecting) { en.target.classList.add("in"); revealIO.unobserve(en.target); }
  });
}, { threshold: 0.12 });

function observeReveals(root = document) {
  root.querySelectorAll(".reveal:not(.in)").forEach((el, i) => {
    el.style.transitionDelay = (i % 4) * 0.08 + "s";
    revealIO.observe(el);
  });
}

// Scroll progress bar
addEventListener("scroll", () => {
  const h = document.documentElement;
  const pct = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight);
  $("progress").style.width = (pct * 100) + "%";
}, { passive: true });

// Floating hearts on scroll
let lastHeart = 0;
addEventListener("scroll", () => {
  const now = Date.now();
  if (now - lastHeart < 900 || $("app").classList.contains("hidden")) return;
  lastHeart = now;
  const h = document.createElement("div");
  h.className = "float";
  h.textContent = ["💖","✨","🌸","💛","🌙"][Math.floor(Math.random()*5)];
  h.style.left = (Math.random() * 90) + "vw";
  h.style.animationDuration = (5 + Math.random() * 3) + "s";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 8000);
}, { passive: true });

/* ---------- Screens ---------- */
function showScreen() {
  const u = auth.currentUser;
  const ok = !!u && ALLOWED_EMAILS.includes(u.email);
  $("gate").classList.toggle("hidden", gatePassed);
  $("login").classList.toggle("hidden", !gatePassed || ok);
  $("app").classList.toggle("hidden", !(gatePassed && ok));
  if (gatePassed && ok) { startListeners(); requestAnimationFrame(() => observeReveals()); }
}

$("gateBtn").onclick = () => {
  if ($("gatePass").value === PASSWORD) { gatePassed = true; $("gateErr").textContent = ""; showScreen(); }
  else {
    $("gateErr").textContent = "Galat password 💔";
    $("gateCard").classList.remove("shake"); void $("gateCard").offsetWidth; $("gateCard").classList.add("shake");
  }
};
$("gatePass").onkeydown = e => { if (e.key === "Enter") $("gateBtn").click(); };

$("googleBtn").onclick = async () => {
  try {
    const cred = await signInWithPopup(auth, new GoogleAuthProvider());
    if (!ALLOWED_EMAILS.includes(cred.user.email)) {
      await signOut(auth);
      $("loginErr").textContent = `Ye account allowed nahi hai 🙈 (${cred.user.email})`;
    }
  } catch (e) { $("loginErr").textContent = e.message; }
};

$("logoutBtn").onclick = async () => { await signOut(auth); gatePassed = false; listening = false; showScreen(); };

onAuthStateChanged(auth, () => showScreen());

/* ---------- Counter & date ---------- */
const days = Math.max(0, Math.floor((Date.now() - START) / 86400000));
$("days").textContent = days;
$("dDate").value = new Date().toISOString().slice(0, 10);

/* ---------- Listeners ---------- */
function startListeners() {
  if (listening) return;
  listening = true;

  // Photos
  onSnapshot(query(collection(db, "photos"), orderBy("createdAt", "desc")), snap => {
    photoMap.clear();
    snap.docs.forEach(d => photoMap.set(d.id, d.data()));
    $("board").innerHTML = snap.docs.length ? snap.docs.map((d, i) => {
      const m = d.data(), r = ((i % 5) - 2) * 1.3;
      return `<div class="polaroid reveal" style="--r:${r}deg">
        <span class="tape"></span>
        <img src="${m.src}" alt="">
        <div class="cap">${esc(m.caption)}</div>
        <div class="meta">${esc(m.date)}</div>
        <div class="pbtns">
          <button class="btn small blue" data-edit="${d.id}">✏️ Edit</button>
          <button class="btn small" data-del="${d.id}">🗑️</button>
        </div></div>`;
    }).join("") : `<p style="grid-column:1/-1;text-align:center">Abhi koi photo nahi… pehli yaad add karo 📸</p>`;
    observeReveals($("board"));
  });

  // Diary
  onSnapshot(query(collection(db, "diary"), orderBy("createdAt", "desc")), snap => {
    diaryMap.clear();
    $("entries").innerHTML = snap.docs.map(d => {
      const m = d.data(); diaryMap.set(d.id, m);
      const photo = m.src ? `<div class="dphoto-wrap"><div class="dphoto"><span class="tape"></span><img src="${m.src}" alt=""></div></div>` : "";
      return `<div class="entry reveal">${photo}<b>${esc(m.date)}</b><br>${esc(m.text)}
        <span class="eb"><button class="btn small blue" data-dedit="${d.id}">✏️</button>
        <button class="btn small" data-ddel="${d.id}">🗑️</button></span></div>`;
    }).join("") || `<p style="font-family:Caveat;font-size:24px;line-height:32px">Pehli entry likho… 🌙</p>`;
    observeReveals($("entries"));
  });

  // Chat
  onSnapshot(query(collection(db, "messages"), orderBy("createdAt", "asc"), limit(100)), snap => {
    const uid = auth.currentUser?.uid;
    $("msgs").innerHTML = snap.docs.map(d => {
      const m = d.data();
      return `<div class="msg ${m.uid === uid ? "me" : ""}"><small>${esc(m.name)}</small><div>${esc(m.text)}</div></div>`;
    }).join("");
    $("msgs").scrollTop = $("msgs").scrollHeight;
  });
}

/* ---------- Image compress ---------- */
function compress(file, max = 900, quality = 0.75) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * s; c.height = img.height * s;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

/* ---------- Photos (scrapbook) ---------- */
function openPhotoModal(id = null, d = {}) {
  photoEditId = id; photoSrc = null;
  $("pTitle").textContent = id ? "Photo edit karo ✏️" : "Nayi yaad 📸";
  $("pCaption").value = d.caption || "";
  $("pDate").value = d.date || new Date().toISOString().slice(0, 10);
  $("pFile").value = "";
  $("pPreview").src = d.src || "";
  $("pPreview").classList.toggle("hidden", !d.src);
  $("photoModal").classList.remove("hidden");
}
const closePhoto = () => $("photoModal").classList.add("hidden");

$("addPhoto").onclick = () => openPhotoModal();
$("pCancel").onclick = closePhoto;
$("pFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  photoSrc = await compress(f);
  $("pPreview").src = photoSrc; $("pPreview").classList.remove("hidden");
};

$("pSave").onclick = async () => {
  const data = { caption: $("pCaption").value.trim(), date: $("pDate").value };
  if (photoSrc) data.src = photoSrc;
  try {
    if (photoEditId) {
      await updateDoc(doc(db, "photos", photoEditId), data);
    } else {
      if (!photoSrc) return alert("Pehle photo select karo 📸");
      data.createdAt = serverTimestamp();
      await addDoc(collection(db, "photos"), data);
    }
    closePhoto();
  } catch (e) { alert("Error: " + e.message); }
};

$("board").onclick = async e => {
  const ed = e.target.closest("[data-edit]"), dl = e.target.closest("[data-del]");
  if (ed) openPhotoModal(ed.dataset.edit, photoMap.get(ed.dataset.edit));
  if (dl && confirm("Ye photo delete karein? 🥺")) await deleteDoc(doc(db, "photos", dl.dataset.del));
};

/* ---------- Diary (with photo) ---------- */
function setDiaryPhoto(src) {
  diaryPhoto = src || null;
  $("dPreview").src = diaryPhoto || "";
  $("dPreviewWrap").classList.toggle("hidden", !diaryPhoto);
}

const resetDiary = () => {
  diaryEditId = null; $("dText").value = "";
  $("dDate").value = new Date().toISOString().slice(0, 10);
  $("dFile").value = "";
  setDiaryPhoto(null);
  $("dSave").textContent = "Save entry 💛"; $("dCancel").classList.add("hidden");
};
$("dCancel").onclick = resetDiary;

$("dFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  setDiaryPhoto(await compress(f, 700, 0.7));
};
$("dRemovePhoto").onclick = () => { setDiaryPhoto(null); $("dFile").value = ""; };

$("diaryForm").onsubmit = async e => {
  e.preventDefault();
  const data = { date: $("dDate").value, text: $("dText").value.trim(), src: diaryPhoto || null };
  try {
    if (diaryEditId) await updateDoc(doc(db, "diary", diaryEditId), data);
    else { data.createdAt = serverTimestamp(); await addDoc(collection(db, "diary"), data); }
    resetDiary();
  } catch (err) { alert("Error: " + err.message); }
};

$("entries").onclick = async e => {
  const ed = e.target.closest("[data-dedit]"), dl = e.target.closest("[data-ddel]");
  if (ed) {
    const m = diaryMap.get(ed.dataset.dedit);
    diaryEditId = ed.dataset.dedit;
    $("dDate").value = m.date; $("dText").value = m.text;
    $("dFile").value = "";
    setDiaryPhoto(m.src || null);
    $("dSave").textContent = "Update entry ✨"; $("dCancel").classList.remove("hidden");
    $("diaryForm").scrollIntoView({ behavior: "smooth", block: "center" });
  }
  if (dl && confirm("Entry delete karein?")) await deleteDoc(doc(db, "diary", dl.dataset.ddel));
};

/* ---------- Chat ---------- */
$("chatBtn").onclick = () => $("chat").classList.toggle("open");
$("chatClose").onclick = () => $("chat").classList.remove("open");
$("chatForm").onsubmit = async e => {
  e.preventDefault();
  const text = $("chatIn").value.trim(); if (!text) return;
  const u = auth.currentUser;
  $("chatIn").value = "";
  await addDoc(collection(db, "messages"), {
    text, uid: u.uid, name: (u.displayName || "Me").split(" ")[0], createdAt: serverTimestamp()
  });
};
</script>
</body>
</html>

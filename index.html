<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>our little universe ✨️</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#ffd6e8;--blue:#d6ecff;--cream:#fff8ec;--ink:#5b4a6b;--sh:rgba(120,90,140,.25)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Fredoka',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
  background:linear-gradient(135deg,#ffe3ef,#e3f0ff 60%,#fff3d9);background-attachment:fixed}
.hidden{display:none!important}

/* Clay */
.clay{background:var(--cream);border-radius:32px;
  box-shadow:12px 12px 24px var(--sh),-10px -10px 20px #fff,inset 6px 6px 12px rgba(255,255,255,.8),inset -6px -6px 12px rgba(160,120,180,.12)}
.btn{font-family:inherit;font-weight:600;font-size:16px;border:none;border-radius:22px;padding:12px 22px;cursor:pointer;color:var(--ink);
  background:var(--pink);box-shadow:6px 6px 14px var(--sh),-5px -5px 12px #fff,inset 3px 3px 6px rgba(255,255,255,.7);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(2px) scale(.98)}
.btn.blue{background:var(--blue)}
.btn.small{padding:6px 12px;font-size:14px;border-radius:14px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
input,textarea{font-family:inherit;width:100%;padding:12px 16px;border:none;border-radius:18px;background:#fff;color:var(--ink);font-size:16px;outline:none;margin-bottom:12px;
  box-shadow:inset 4px 4px 8px rgba(0,0,0,.06),inset -4px -4px 8px #fff}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{max-width:380px;width:100%;padding:36px;text-align:center}
.card h1,.hero h1{font-family:Caveat,cursive;font-size:44px;line-height:1.1;margin-bottom:10px}
.err{color:#d6336c;min-height:22px;margin-top:10px;font-size:15px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* Scroll progress + reveal */
#progress{position:fixed;top:0;left:0;height:5px;width:0;z-index:200;
  background:linear-gradient(90deg,#ff8fb8,#9cc9ff,#ffd86b);border-radius:0 4px 4px 0}
.reveal{opacity:0;translate:0 50px;transition:opacity .8s ease,translate .8s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;translate:0 0}

/* App layout */
#app{padding:90px 18px 40px;max-width:1000px;margin:auto}
.fab{position:fixed;top:16px;right:16px;z-index:60}
.logout{position:absolute;top:18px;left:18px}
.hero{text-align:center;padding:40px 20px;margin-bottom:34px;position:relative}
.hero .names{font-family:Caveat,cursive;font-size:30px;color:#c2578f}
.hero p.count{margin-top:8px;font-size:18px}
h2{font-family:Caveat,cursive;font-size:38px;margin:10px 0 16px}
section{margin-bottom:60px}

/* Scrapbook */
.board{margin-top:24px;padding:30px 20px;border-radius:32px;background-color:#f6ecd9;
  background-image:radial-gradient(#d9c7a5 1.2px,transparent 1.3px);background-size:22px 22px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:34px;
  box-shadow:inset 6px 6px 14px rgba(120,90,40,.15),8px 8px 18px var(--sh)}
.polaroid{background:#fff;padding:12px 12px 16px;border-radius:6px;position:relative;
  box-shadow:0 10px 20px rgba(0,0,0,.15);transform:rotate(var(--r));transition:transform .2s}
.polaroid:hover{transform:rotate(0) scale(1.03)}
.polaroid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;display:block}
.tape{position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(-3deg);width:90px;height:26px;background:rgba(255,226,140,.75);box-shadow:0 2px 4px rgba(0,0,0,.08)}
.cap{font-family:Caveat,cursive;font-size:24px;text-align:center;margin-top:8px;line-height:1.1}
.meta{font-size:13px;text-align:center;opacity:.65;margin-top:2px}
.pbtns{display:flex;gap:6px;justify-content:center;margin-top:10px}
.empty{grid-column:1/-1;text-align:center;padding:20px}

/* Retro diary book */
.diary-wrap{max-width:600px;margin:0 auto}
.book{position:relative;height:min(72vh,620px);perspective:2000px;touch-action:manipulation;cursor:pointer}
.page{position:absolute;inset:0;transform-origin:left center;transition:transform .8s cubic-bezier(.45,.05,.25,1);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background-color:#fff1a0;background-image:repeating-linear-gradient(transparent 0 31px,#e8c35e 31px 32px);background-position:0 70px;
  border-radius:6px 24px 24px 6px;box-shadow:10px 10px 22px var(--sh);
  padding:26px 24px 20px 62px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.page::before{content:"";position:absolute;left:46px;top:0;bottom:0;width:2px;background:#e88aa0;opacity:.7}
.page::after{content:"";position:absolute;left:10px;top:0;bottom:0;width:26px;
  background:radial-gradient(circle,#fff8e0 0 4px,#7d6d45 5px 7px,transparent 8px) 0 6px/26px 34px repeat-y}
.page.flipped{transform:rotateY(-180deg)}
.pdate{font-family:Caveat,cursive;font-size:28px;font-weight:700;color:#b5487a;line-height:34px}
.pimg{display:flex;justify-content:center;flex:0 0 auto}
.pimg img{max-width:85%;max-height:230px;object-fit:cover;border-radius:4px;background:#fff;padding:8px 8px 12px;
  box-shadow:0 8px 16px rgba(0,0,0,.15);transform:rotate(-1.5deg)}
.ptext{font-family:Caveat,cursive;font-size:23px;line-height:32px;white-space:pre-wrap;word-break:break-word;overflow-y:auto;flex:1;min-height:0}
.emptybook{height:100%;display:flex;align-items:center;justify-content:center;font-family:Caveat,cursive;font-size:28px;text-align:center;padding:20px;
  background:#fff1a0;border-radius:6px 24px 24px 6px;box-shadow:10px 10px 22px var(--sh)}
.pnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.pnav .info{font-family:Caveat,cursive;font-size:22px}
.pactions{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.tap-hint{text-align:center;font-size:13px;opacity:.6;margin-top:8px}

/* Modals */
.modal{position:fixed;inset:0;background:rgba(60,40,80,.35);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal .clay{width:100%;max-width:400px;padding:28px;max-height:90vh;overflow-y:auto}
.modal h2{margin-top:0}
.pv{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px;margin-bottom:12px;display:block}
.dpv-wrap{position:relative;margin-bottom:12px}
.dpv-wrap img{width:100%;max-height:240px;object-fit:cover;border-radius:14px;display:block}
.dpv-wrap .btn{position:absolute;top:8px;right:8px;padding:4px 10px}
.mbtns{display:flex;gap:10px;justify-content:flex-end}
.dtext{background:#fff1a0;border:2px dashed #e8c35e;font-family:Caveat,cursive;font-size:22px;line-height:30px;min-height:140px}
input[type=date]{max-width:100%}

/* Chat */
.chat{position:fixed;top:0;right:0;bottom:0;width:min(370px,100%);z-index:90;border-radius:32px 0 0 32px;
  display:flex;flex-direction:column;padding:20px;transform:translateX(110%);transition:transform .35s ease}
.chat.open{transform:translateX(0)}
.chat-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.chat-head h3{font-family:Caveat,cursive;font-size:30px}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px}
.msg{max-width:80%;background:#fff;padding:10px 14px;border-radius:18px 18px 18px 4px;align-self:flex-start;box-shadow:4px 4px 10px var(--sh)}
.msg small{font-size:11px;opacity:.6}
.msg.me{align-self:flex-end;background:var(--pink);border-radius:18px 18px 4px 18px}
#chatForm{display:flex;gap:8px;margin-top:12px}
#chatForm input{margin:0}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;padding:12px 18px;border-radius:18px;
  box-shadow:0 8px 20px var(--sh);z-index:300;max-width:90vw;text-align:center}

@media (prefers-reduced-motion:reduce){.reveal{transition:none;opacity:1;translate:0 0}.page{transition:none}}
</style>
</head>
<body>
<div id="progress"></div>

<!-- PASSWORD GATE -->
<div id="gate" class="center">
  <div class="clay card" id="gateCard">
    <h1>our little universe ✨️</h1>
    <p>Pehle secret password daalo 🔒</p>
    <input id="gatePass" type="password" placeholder="Password">
    <button class="btn blue" id="gateBtn">Enter 💖</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<!-- GOOGLE LOGIN -->
<div id="login" class="center hidden">
  <div class="clay card">
    <h1>Welcome back 💕</h1>
    <p style="margin-bottom:22px">Google se sign in karo</p>
    <button class="btn" id="googleBtn">🔐 Sign in with Google</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">
  <button class="btn blue fab" id="chatBtn">💬 Chat</button>

  <header class="clay hero reveal">
    <button class="btn small logout" id="logoutBtn">Logout</button>
    <h1>our little universe ✨️</h1>
    <p class="names">Antra 💖 Prince</p>
    <p class="count">Together for <b id="days">0</b> days 🎂 · since 4 March 2026</p>
  </header>

  <section>
    <h2 class="reveal">📸 Our Scrapbook</h2>
    <button class="btn reveal" id="addPhoto">+ Add photo</button>
    <div class="board reveal" id="board"></div>
  </section>

  <section>
    <h2 class="reveal">📖 Our Diary</h2>
    <div class="diary-wrap reveal">
      <div class="book" id="book"></div>
      <div class="pnav">
        <button class="btn small" id="prevBtn">‹ Prev</button>
        <span class="info" id="pageInfo"></span>
        <button class="btn small" id="nextBtn">Next ›</button>
      </div>
      <div class="pactions">
        <button class="btn small blue" id="newPageBtn">+ Naya page</button>
        <button class="btn small blue" id="editPageBtn">✏️ Edit</button>
        <button class="btn small" id="delPageBtn">🗑️ Delete</button>
      </div>
      <p class="tap-hint">Screen ke left/right tap karke page palto 📖</p>
    </div>
  </section>

  <aside class="clay chat" id="chat">
    <div class="chat-head">
      <h3>our chat 💌</h3>
      <button class="btn small" id="chatClose">✖</button>
    </div>
    <div id="msgs"></div>
    <form id="chatForm">
      <input id="chatIn" placeholder="Message likho..." autocomplete="off">
      <button class="btn small blue" type="submit">➤</button>
    </form>
  </aside>
</div>

<!-- PHOTO MODAL (scrapbook) -->
<div class="modal hidden" id="photoModal">
  <div class="clay">
    <h2 id="pTitle">Nayi yaad 📸</h2>
    <img id="pPreview" class="pv hidden" alt="">
    <input type="file" id="pFile" accept="image/*">
    <input id="pCaption" placeholder="Caption (jaise: Our first trip 🌸)">
    <input type="date" id="pDate">
    <div class="mbtns">
      <button class="btn small" id="pCancel">Cancel</button>
      <button class="btn small blue" id="pSave">Save 💾</button>
    </div>
  </div>
</div>

<!-- DIARY PAGE MODAL -->
<div class="modal hidden" id="diaryModal">
  <div class="clay">
    <h2 id="dmTitle">Naya page 📖</h2>
    <input type="date" id="dmDate">
    <div id="dmPreviewWrap" class="dpv-wrap hidden">
      <img id="dmPreview" alt="">
      <button type="button" class="btn small" id="dmRemove">✖</button>
    </div>
    <input type="file" id="dmFile" accept="image/*">
    <textarea id="dmText" class="dtext" placeholder="Aaj ki baat likho... 💭"></textarea>
    <div class="mbtns">
      <button class="btn small" id="dmCancel">Cancel</button>
      <button class="btn small blue" id="dmSave">Save 💛</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAiKgwAqCptCiWh3xG2DgIRdnOy9dlt3Ww",
  authDomain: "our-little-universe-73207.firebaseapp.com",
  projectId: "our-little-universe-73207",
  storageBucket: "our-little-universe-73207.firebasestorage.app",
  messagingSenderId: "446105820889",
  appId: "1:446105820889:web:8a2222ee8429b3d92da8c8",
  measurementId: "G-QCNJYS0QS5"
};

const PASSWORD = "Antra@4545";
const ALLOWED_EMAILS = ["antragond40@gmail.com", "jhap20046@gmail.com"];
const START = new Date(2026, 2, 4);

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toISOString().slice(0, 10);

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

let gatePassed = false, listening = false;
let photoEditId = null, photoSrc = null;
let diaryEditId = null, diaryPhoto = null, pendingGoLast = false;
let cur = 0, entries = [];
const photoMap = new Map();

/* ---------- Scroll reveal + progress ---------- */
const revealIO = new IntersectionObserver(list => {
  list.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); revealIO.unobserve(en.target); } });
}, { threshold: 0.1 });
function observeReveals() {
  document.querySelectorAll(".reveal:not(.in)").forEach(el => revealIO.observe(el));
}
addEventListener("scroll", () => {
  const h = document.documentElement;
  $("progress").style.width = (h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight) * 100) + "%";
}, { passive: true });

/* ---------- Screens ---------- */
function showScreen() {
  const u = auth.currentUser;
  const ok = !!u && ALLOWED_EMAILS.includes(u.email);
  $("gate").classList.toggle("hidden", gatePassed);
  $("login").classList.toggle("hidden", !gatePassed || ok);
  $("app").classList.toggle("hidden", !(gatePassed && ok));
  if (gatePassed && ok) { startListeners(); requestAnimationFrame(observeReveals); }
}

$("gateBtn").onclick = () => {
  if ($("gatePass").value === PASSWORD) { gatePassed = true; $("gateErr").textContent = ""; showScreen(); }
  else {
    $("gateErr").textContent = "Galat password 💔";
    $("gateCard").classList.remove("shake"); void $("gateCard").offsetWidth; $("gateCard").classList.add("shake");
  }
};
$("gatePass").onkeydown = e => { if (e.key === "Enter") $("gateBtn").click(); };

$("googleBtn").onclick = async () => {
  try {
    const cred = await signInWithPopup(auth, new GoogleAuthProvider());
    if (!ALLOWED_EMAILS.includes(cred.user.email)) {
      await signOut(auth);
      $("loginErr").textContent = `Ye account allowed nahi hai 🙈 (${cred.user.email})`;
    }
  } catch (e) { $("loginErr").textContent = e.message; }
};

$("logoutBtn").onclick = async () => { await signOut(auth); gatePassed = false; listening = false; showScreen(); };
onAuthStateChanged(auth, () => showScreen());

$("days").textContent = Math.max(0, Math.floor((Date.now() - START) / 86400000));

/* ---------- Live listeners ---------- */
function startListeners() {
  if (listening) return;
  listening = true;
  const onErr = where => e => { console.error(where, e); toast(`${where} error: ${e.code || e.message}`); };

  // Scrapbook (live, unlimited)
  onSnapshot(query(collection(db, "photos"), orderBy("createdAt", "desc")), snap => {
    photoMap.clear();
    snap.docs.forEach(d => photoMap.set(d.id, d.data()));
    $("board").innerHTML = snap.docs.length ? snap.docs.map((d, i) => {
      const m = d.data(), r = ((i % 5) - 2) * 1.3;
      return `<div class="polaroid" style="--r:${r}deg">
        <span class="tape"></span>
        <img src="${m.src}" alt="">
        <div class="cap">${esc(m.caption)}</div>
        <div class="meta">${esc(m.date)}</div>
        <div class="pbtns">
          <button class="btn small blue" data-edit="${d.id}">✏️ Edit</button>
          <button class="btn small" data-del="${d.id}">🗑️</button>
        </div></div>`;
    }).join("") : `<p class="empty">Abhi koi photo nahi… pehli yaad add karo 📸</p>`;
  }, onErr("Photos"));

  // Diary (live, oldest page first)
  onSnapshot(query(collection(db, "diary"), orderBy("createdAt", "asc")), snap => {
    entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (pendingGoLast) { cur = Math.max(0, entries.length - 1); pendingGoLast = false; }
    renderBook();
  }, onErr("Diary"));

  // Chat (live)
  onSnapshot(query(collection(db, "messages"), orderBy("createdAt", "asc"), limit(100)), snap => {
    const uid = auth.currentUser?.uid;
    $("msgs").innerHTML = snap.docs.map(d => {
      const m = d.data();
      return `<div class="msg ${m.uid === uid ? "me" : ""}"><small>${esc(m.name)}</small><div>${esc(m.text)}</div></div>`;
    }).join("");
    $("msgs").scrollTop = $("msgs").scrollHeight;
  }, onErr("Chat"));
}

/* ---------- Image compress ---------- */
function compress(file, max = 800, quality = 0.7) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * s; c.height = img.height * s;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

/* ---------- Scrapbook ---------- */
function openPhotoModal(id = null, d = {}) {
  photoEditId = id; photoSrc = null;
  $("pTitle").textContent = id ? "Photo edit karo ✏️" : "Nayi yaad 📸";
  $("pCaption").value = d.caption || "";
  $("pDate").value = d.date || today();
  $("pFile").value = "";
  $("pPreview").src = d.src || "";
  $("pPreview").classList.toggle("hidden", !d.src);
  $("photoModal").classList.remove("hidden");
}
const closePhoto = () => $("photoModal").classList.add("hidden");

$("addPhoto").onclick = () => openPhotoModal();
$("pCancel").onclick = closePhoto;
$("pFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  photoSrc = await compress(f, 900, 0.75);
  $("pPreview").src = photoSrc; $("pPreview").classList.remove("hidden");
};
$("pSave").onclick = async () => {
  const data = { caption: $("pCaption").value.trim(), date: $("pDate").value };
  if (photoSrc) data.src = photoSrc;
  try {
    if (photoEditId) await updateDoc(doc(db, "photos", photoEditId), data);
    else {
      if (!photoSrc) return toast("Pehle photo select karo 📸");
      data.createdAt = serverTimestamp();
      await addDoc(collection(db, "photos"), data);
    }
    closePhoto();
    toast("Photo save ho gayi 📸");
  } catch (e) { toast("Error: " + (e.code || e.message)); }
};
$("board").onclick = async e => {
  const ed = e.target.closest("[data-edit]"), dl = e.target.closest("[data-del]");
  if (ed) {
    const m = photoMap.get(ed.dataset.edit);
    openPhotoModal(ed.dataset.edit, m);
  }
  if (dl && confirm("Ye photo delete karein? 🥺")) {
    try { await deleteDoc(doc(db, "photos", dl.dataset.del)); toast("Photo delete ho gayi"); }
    catch (err) { toast("Error: " + (err.code || err.message)); }
  }
};

/* ---------- Retro diary book ---------- */
function renderBook() {
  const book = $("book");
  if (!entries.length) {
    book.innerHTML = `<div class="emptybook">Abhi koi page nahi… pehla page likho 📖</div>`;
    $("pageInfo").textContent = "Page 0 / 0";
    $("prevBtn").disabled = $("nextBtn").disabled = true;
    $("editPageBtn").disabled = $("delPageBtn").disabled = true;
    return;
  }
  cur = Math.min(cur, entries.length - 1);
  book.innerHTML = entries.map(m => `
    <div class="page">
      <div class="pdate">${esc(m.date)}</div>
      ${m.src ? `<div class="pimg"><img src="${m.src}" alt=""></div>` : ""}
      <div class="ptext">${esc(m.text)}</div>
    </div>`).join("");
  updateFlips(-1);
  updateNav();
}

function updateFlips(keep) {
  const pages = [...$("book").children], n = pages.length;
  pages.forEach((p, i) => {
    p.classList.toggle("flipped", i < cur);
    p.style.zIndex = i === keep ? 999 : (i < cur ? i + 1 : n - i);
  });
}

function updateNav() {
  $("pageInfo").textContent = `Page ${cur + 1} / ${entries.length}`;
  $("prevBtn").disabled = cur === 0;
  $("nextBtn").disabled = cur >= entries.length - 1;
  $("editPageBtn").disabled = $("delPageBtn").disabled = false;
}

function go(delta) {
  const n = cur + delta;
  if (n < 0 || n >= entries.length) return;
  const moving = delta > 0 ? cur : n;   // jo page palat raha hai, usse upar rakho
  cur = n;
  updateFlips(moving);
  updateNav();
  setTimeout(() => updateFlips(-1), 850);
}

$("prevBtn").onclick = () => go(-1);
$("nextBtn").onclick = () => go(1);
$("book").onclick = e => {
  if (e.target.closest("button")) return;
  const r = $("book").getBoundingClientRect();
  go(e.clientX > r.left + r.width / 2 ? 1 : -1);
};

/* diary modal */
function setDiaryPhoto(src) {
  diaryPhoto = src || null;
  $("dmPreview").src = diaryPhoto || "";
  $("dmPreviewWrap").classList.toggle("hidden", !diaryPhoto);
}
function openDiaryModal(id = null) {
  const m = id ? entries.find(x => x.id === id) : null;
  diaryEditId = id;
  $("dmTitle").textContent = id ? "Page edit karo ✏️" : "Naya page 📖";
  $("dmDate").value = m?.date || today();
  $("dmText").value = m?.text || "";
  $("dmFile").value = "";
  setDiaryPhoto(m?.src || null);
  $("diaryModal").classList.remove("hidden");
}
const closeDiary = () => $("diaryModal").classList.add("hidden");

$("newPageBtn").onclick = () => openDiaryModal();
$("editPageBtn").onclick = () => { if (entries[cur]) openDiaryModal(entries[cur].id); };
$("dmCancel").onclick = closeDiary;
$("dmRemove").onclick = () => { setDiaryPhoto(null); $("dmFile").value = ""; };
$("dmFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  setDiaryPhoto(await compress(f, 800, 0.7));
};
$("dmSave").onclick = async () => {
  const data = { date: $("dmDate").value, text: $("dmText").value.trim(), src: diaryPhoto || null };
  if (!data.text && !data.src) return toast("Kuch likho ya photo daalo 💛");
  try {
    if (diaryEditId) await updateDoc(doc(db, "diary", diaryEditId), data);
    else {
      data.createdAt = serverTimestamp();
      await addDoc(collection(db, "diary"), data);
      pendingGoLast = true;   // naya page khulega
    }
    closeDiary();
    toast("Page save ho gaya 💛");
  } catch (e) { toast("Error: " + (e.code || e.message)); }
};
$("delPageBtn").onclick = async () => {
  const m = entries[cur];
  if (!m || !confirm("Ye page delete karein? 🥺")) return;
  try { await deleteDoc(doc(db, "diary", m.id)); toast("Page delete ho gaya"); }
  catch (err) { toast("Error: " + (err.code || err.message)); }
};

/* ---------- Chat ---------- */
$("chatBtn").onclick = () => $("chat").classList.toggle("open");
$("chatClose").onclick = () => $("chat").classList.remove("open");
$("chatForm").onsubmit = async e => {
  e.preventDefault();
  const text = $("chatIn").value.trim(); if (!text) return;
  const u = auth.currentUser;
  $("chatIn").value = "";
  try {
    await addDoc(collection(db, "messages"), {
      text, uid: u.uid, name: (u.displayName || "Me").split(" ")[0], createdAt: serverTimestamp()
    });
  } catch (err) { toast("Chat error: " + (err.code || err.message)); }
};
</script>
